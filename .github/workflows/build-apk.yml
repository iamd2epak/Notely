name: Build Notely APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# A newer push cancels a build that is still running, so no minutes are wasted.
concurrency:
  group: notely-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Notely.apk

      # The APK is published as a GitHub Release (release files don't use Actions storage).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notely-v1.1.${{ github.run_number }}
          name: Notely v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Download **Notely.apk** below and open it on your Android phone to install. It updates the previous version and keeps your notes.
          files: Notely.apk

      # Keep only the newest APK: remove older Notely releases and any old build artifacts.
      - name: Remove previous APKs
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: notely-v1.1.${{ github.run_number }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | grep '^notely-v' | grep -vx "$NEW_TAG" \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate -q '.artifacts[] | select(.name == "Notely-apk") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
